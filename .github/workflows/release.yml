name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0"
        required: true
permissions: 
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version must match package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::Input ${{ inputs.version }} does not match package.json $PKG"
            exit 1
          fi
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"
  publish:
    needs: verify
    runs-on: ubuntu-latest 
    environment: production
    permissions: 
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" *.tgz --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v${{ inputs.version }}" --generate-notes
